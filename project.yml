# Cairn — XcodeGen spec.
# The .xcodeproj is GENERATED from this file and is NOT committed.
#   xcodegen generate        (XcodeGen is not preinstalled on GitHub macOS runners)
# SwiftPM here is only for internal module boundaries; the app target below is
# the real iOS application target.

name: Cairn
options:
  bundleIdPrefix: app.cairn
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  CairnChatDomain:
    path: Packages/CairnChatDomain
  CairnPersistence:
    path: Packages/CairnPersistence
  CairnProviderRemote:
    path: Packages/CairnProviderRemote
  # M3 on-device engines. CairnInferenceLocal is pure Swift 6 (memory fit, single-resident policy,
  # catalog, verified downloads, Apple Foundation Models). CairnInferenceNative is the Swift 5
  # island that may import mlx-swift-lm; it links that runtime only when CAIRN_MLX=1 is set, so an
  # ordinary Xcode or CI build resolves it without downloading MLX and the provider reports honestly
  # that the runtime is not in this build.
  CairnInferenceLocal:
    path: Packages/CairnInferenceLocal
  CairnInferenceNative:
    path: Packages/CairnInferenceNative
  CairnAppUI:
    path: Packages/CairnAppUI

targets:
  Cairn:
    name: Cairn
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: CairnChatDomain
      - package: CairnPersistence
      - package: CairnProviderRemote
      - package: CairnAppUI
      # The two on-device engines, so the app can run a model with no server at all.
      - package: CairnInferenceLocal
      - package: CairnInferenceNative
    info:
      path: App/Info.plist
      # ATS (decision 2026-11-15, supersedes 2026-11-14): exactly one key, and it is the
      # narrowest one Apple offers. Apple's own scope says ATS "applies only to connections
      # made to public host names" and gives no protection to IP addresses, unqualified host
      # names, or .local hosts — so a LAN or VPN inference server addressed by IP works over
      # http with NO exception at all. NSAllowsLocalNetworking is here for the remaining case,
      # a .local or unqualified *name*, and Apple states its presence makes ATS ignore
      # NSAllowsArbitraryLoads outright (treated as NO), so adding it narrows this app's ATS
      # posture rather than widening it. Public-internet profiles still require https, enforced
      # in ServerProfile validation. check-ats.sh allows this one key and fails on any other.
      properties:
        CFBundleDisplayName: Cairn
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # ATS: the single permitted exception, scoped to the local network only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Local Network + Bonjour are INDEPENDENT of ATS: iOS gates any connection to a
        # LAN address behind this prompt, so the first request to a private server needs
        # the user to allow it. Bonjour discovery itself is deferred to M7.
        NSLocalNetworkUsageDescription: "Cairn connects to the inference server you run on your own network, such as Ollama, llama.cpp, or LM Studio, so your prompts can reach it from this device."
        NSBonjourServices:
          - _http._tcp
        LSApplicationCategoryType: public.app-category.productivity
        # A Cairn chat file: JSON with a type of its own, so the file a user exports has a name and a kind
        # in the Files app, and a file handed back to Cairn arrives as something this app recognises. It
        # conforms to public.json, so any editor can still open it — the declaration adds a name, it hides
        # nothing. Nothing here opens a network path: an opened file is bytes the system hands over.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.cairn.chat
            UTTypeConformsTo:
              - public.json
            UTTypeDescription: "Cairn chat"
            UTTypeTagSpecification:
              public.filename-extension:
                - cairn
              public.mime-type:
                - application/vnd.cairn.chat
        CFBundleDocumentTypes:
          - CFBundleTypeName: Cairn chat
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - app.cairn.chat
        # Location: when-in-use only, and one reading at a time. The string says what the tool does and what
        # it does not do, because a permission prompt is the one place a person can learn the truth about a
        # feature before agreeing to it. There is no background mode and no `NSLocationAlwaysUsageDescription`
        # anywhere in this project: the source calls `requestLocation()` once and never enters continuous
        # updates, so background location is not merely disallowed, it is not requested.
        NSLocationWhenInUseUsageDescription: "Cairn reads one position so an answer can depend on where you are — only after you allow the location tool, in this chat, while Cairn is open. The reading goes to no map or geocoding service, and Cairn does not track you."
    configFiles:
      # Signing chain. Config/Signing.xcconfig optionally #includes the git-ignored
      # Config/Local.xcconfig, so a local Team ID is picked up when the file exists and CI,
      # which never has it, still builds unsigned exactly as before.
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        # CAIRN_BUNDLE_ID is set in Config/Signing.xcconfig (default app.cairn.cairn). A personal
        # bundle id belongs in the git-ignored Config/Local.xcconfig, never here.
        PRODUCT_BUNDLE_IDENTIFIER: $(CAIRN_BUNDLE_ID)
        PRODUCT_NAME: Cairn
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "iPhone Developer"
        Release:
          CODE_SIGN_IDENTITY: ""

  CairnTests:
    name: CairnTests
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/CairnTests
      # One app-layer file, compiled straight into the test bundle: it holds the residency wiring M4
      # promises (the factory that turns a registry into the gate every session gets) and has no @main
      # and no app-only imports, so the simulator suite can prove that factory instead of trusting it.
      - App/HybridWiring.swift
      # The second app-layer file, for the same reason: P3b's tool assembly is the one place a registry
      # can be built (a window, a Keychain, and the two Settings switches meet only here), and it has no
      # @main either. Testing it here is what proves a chat really gets the web tools the switches allow.
      - App/ToolWiring.swift
      # M6's two attachment seams, for the same reason and for the same reason they need a simulator: the
      # preparer is ImageIO against real bytes (a host build has no codec, which is why the domain's own
      # preparer is the honest passthrough), and the wiring is the one place the store's file reader meets
      # the session that asks for it. Neither has @main.
      - App/ImageIOPreparer.swift
      - App/AttachmentWiring.swift
      # P4's share wiring, for the same reason and with the same reason to need a simulator: it is the only
      # place the live engine registry, the Keychain-backed peer key and the listener meet, and the rule it
      # owns — the port lives only while the app is in the foreground — is a rule about the scene, which a
      # host build has no scene to model. No @main here either.
      - App/ShareWiring.swift
      # P3b's web-search surface, for the same reason: it is the only place the settings store, the two
      # Keychain vaults and the consent sheet meet. Two of the rules it owns can only be proved with all three
      # present — that a public search stops in front of a sheet instead of running, and that a refusal is held
      # rather than re-asked. No @main here either.
      - App/WebSearchWiring.swift
      # The location surface and its CoreLocation source, for the same reason and needing a simulator for the
      # same reason: this is the only place the domain's consent record, the UI's sheet and a
      # CLLocationManager exist together, and the promise worth proving is the order — a refusal performs no
      # hardware work at all, which no test inside any one of the three modules can see. No @main in either
      # file, and no test here ever starts a real location request.
      - App/LocationWiring.swift
      - App/LocationProvider.swift
      - App/LocationProvider+Mapping.swift
    dependencies:
      - package: CairnChatDomain
      - package: CairnPersistence
      # The Servers screen is tested through its view model, which needs the remote
      # factory to prove that saved profiles really become engines.
      - package: CairnAppUI
      - package: CairnProviderRemote
      # The residency gate a hybrid turn asks is built here, on the real memory reading, so the
      # simulator suite has to be able to construct it and the registry behind it.
      - package: CairnInferenceLocal
    configFiles:
      # The one shared xcconfig, same as the app target, so a local Team ID in Local.xcconfig covers
      # app and tests together; the bundle ids stay distinct because the test bundle is derived as
      # $(CAIRN_BUNDLE_ID).tests. A separate test xcconfig that included this one was tried and broke
      # CI: Xcode does not resolve an `#include "$(SRCROOT)/..."` path from an xcconfig, so the test
      # target failed before any test ran (run 43794042407, "could not find included file
      # '$(SRCROOT)/Config/Signing.xcconfig' in search paths (in target 'CairnTests')"). One file, one
      # include, no nesting — that is what makes CAIRN_BUNDLE_ID resolve for both targets.
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        # Derived from CAIRN_BUNDLE_ID so a personal override in the git-ignored
        # Config/Local.xcconfig moves the app and its test bundle together and cannot collide.
        PRODUCT_BUNDLE_IDENTIFIER: $(CAIRN_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Cairn:
    build:
      targets:
        Cairn: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CairnTests
    profile:
      config: Release
    archive:
      config: Release
