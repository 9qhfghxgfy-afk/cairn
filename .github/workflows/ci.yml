# Cairn CI. macOS runners are the build box because there is no Xcode on the
# authoring machine. Standard GitHub-hosted macOS runners cost nothing on a public
# repository, which is what keeps this project free to build.
#
# Pinned: macos-26 + Xcode_26.6 (SDK ceiling iOS 26.5). The xcode-27 image is
# public preview and is only exercised by nightly.yml — never a milestone gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.6"
  SIMULATOR_NAME: "iPhone 17"
  SIMULATOR_OS: "26.5"

jobs:
  guards:
    name: Privacy guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: No prompt / response / secret logging
        run: bash Scripts/check-logging.sh
      - name: ATS carries only NSAllowsLocalNetworking
        run: bash Scripts/check-ats.sh
      - name: No real private hostname in tracked files
        run: bash Scripts/check-hostname.sh
      - name: No Team ID or signing identity in tracked files
        run: bash Scripts/check-signing.sh
      # Cairn is free and unlimited by design: no in-app billing, no tier, no upsell string, no
      # artificial cap on chats/messages/servers/models, no tracking hook. Scoped to what compiles
      # into the binary, so the rules and docs can still name what they forbid. This step's own
      # comment deliberately avoids spelling any forbidden word, and the script name it invokes is
      # why workflow files are not part of the scanned scope.
      - name: No monetization, usage cap, or tracking hook in shipped sources
        run: bash Scripts/check-no-paywall.sh
      # The guards above are only worth what their patterns are worth. This re-runs them against
      # planted values in a throwaway tree and fails if any guard stops rejecting them, or if a
      # guard prints the value it caught.
      - name: Guard self-test (guards must still fail on planted values)
        run: bash Scripts/test-guards.sh

  domain:
    name: Host unit tests (macOS)
    needs: guards
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
      - name: Toolchain probe
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i -E 'iphoneos|iphonesimulator' || true
          xcrun simctl list runtimes | grep -i ios || true
          swift --version
      - name: Tree, streaming, and cancellation tests
        run: swift test --package-path Packages/CairnChatDomain
      # URLSession delegate, SSE/NDJSON framing, Keychain policy, and Stop against a
      # loopback listener. No internet access is used, so the job stays hermetic.
      - name: Remote provider, profile, and secret tests
        run: swift test --package-path Packages/CairnProviderRemote
      # Memory fit, single-resident eviction, catalog and repo-ID rules, checksum verification,
      # pause/resume, and the Foundation Models availability mapping. Host-only by design: no model
      # files, no network, no device.
      - name: On-device inference, memory, and catalog tests
        run: swift test --package-path Packages/CairnInferenceLocal
      # The Swift 5 isolation island: template marker parsing (thinking regions and tool fences),
      # the actor boundary's typed failures, and the no-Metal fallback. Run with the runtime
      # excluded on purpose — linking mlx-swift-lm compiles swift-syntax macros and a vendored C++
      # engine from source, which is not a CI-time-box cost. The gap is recorded in ROADMAP.md.
      - name: Native runtime isolation and template-marker parsing tests
        env:
          CAIRN_SKIP_MLX: "1"
        run: swift test --package-path Packages/CairnInferenceNative

  app:
    name: Build + test on simulator
    needs: domain
    runs-on: macos-26
    # A green lane takes about five minutes here. It was 30, and two runs spent the whole 30 sitting in the
    # test step before GitHub killed the job (44379381555, 44384383553) — the cost of a hang, paid in runner
    # time and in wall-clock by whoever is waiting on a milestone. 20 leaves four times the headroom a slow
    # runner could plausibly need and halves what a hang costs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Install XcodeGen (not preinstalled on macOS runners)
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate the .xcodeproj from project.yml
        run: xcodegen generate

      # The guards job has only the spec; here the plist really shipped is checked, so a key
      # that XcodeGen would drop or alter cannot slip past the static guard.
      - name: ATS guard on the generated plist
        run: bash Scripts/check-ats.sh

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project Cairn.xcodeproj -scheme Cairn

      - name: Build
        run: |
          xcodebuild \
            -project Cairn.xcodeproj \
            -scheme Cairn \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test on ${{ env.SIMULATOR_NAME }} / iOS ${{ env.SIMULATOR_OS }}
        run: |
          # No `| xcbeautify` on this step, deliberately. xcbeautify buffers its own output whenever stdout
          # is a pipe instead of a terminal, so a lane's whole log arrives in one burst when the process
          # exits — which means nothing at all arrives when the process never exits. Two lanes were killed at
          # their job timeout having printed not one line about where they were stuck (44379381555 and
          # 44384383553, both with the build green and the test step silent for half an hour). Raw xcodebuild
          # writes straight through, the way the Build step above streams live, so a hang now names the test
          # it is sitting in instead of hiding it.
          xcodebuild \
            -project Cairn.xcodeproj \
            -scheme Cairn \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME},OS=${SIMULATOR_OS}" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            -resultBundlePath ResultBundles/Cairn.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cairn-test-results
          path: ResultBundles/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload generated project on failure (for debugging CI drift)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: generated-xcodeproj
          path: Cairn.xcodeproj
          if-no-files-found: ignore
          retention-days: 3
