# Unsigned device IPA for sideloading. workflow_dispatch only — this is not a
# milestone gate; CI's ci.yml stays the gate. Output: Cairn-unsigned.ipa, signed
# later on the authoring PC with Sideloadly + free Apple ID (docs/INSTALL.md).
# Release configuration so the artifact matches the App Store-clean build shape: the one
# permitted ATS key (NSAllowsLocalNetworking) and no entitlements beyond what the signing
# profile carries.

name: IPA (unsigned device build)

on:
  workflow_dispatch:

env:
  XCODE_VERSION: "26.6"
  # The on-device MLX runtime, linked into the shipped binary. This is the build that must carry it: with
  # the flag absent, `CairnInferenceNative/Package.swift` resolves WITHOUT mlx-swift-lm, the provider says
  # in its own words that the runtime is not in this build, and a model the user downloaded has nothing on
  # the phone that can run it. The simulator lanes in ci.yml keep it out deliberately — Metal is absent on
  # the simulator, and the C++ core would be compiled from source on every push.
  CAIRN_MLX: "1"

jobs:
  ipa:
    name: Unsigned device IPA
    runs-on: macos-26
    # 30 was enough while MLX was excluded. Linking it means compiling a vendored C++ and Metal core from
    # source inside this job, so the clock has to cover the runtime as well as the app.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate the .xcodeproj from project.yml
        run: xcodegen generate

      - name: Build Release for device (unsigned)
        run: |
          xcodebuild \
            -project Cairn.xcodeproj \
            -scheme Cairn \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify the built app
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release-iphoneos/Cairn.app"
          test -d "$APP"
          # lipo wants the input file FIRST, then the operation
          lipo "$APP/Cairn" -verify_arch arm64
          plutil -lint "$APP/Info.plist"
          SIGINFO="$(codesign -dv "$APP" 2>&1 || true)"
          if ! printf '%s' "$SIGINFO" | grep -q 'not signed'; then
            echo "FAIL: app carries a signature; it must ship unsigned:"
            printf '%s\n' "$SIGINFO" | head -3
            exit 1
          fi
          echo "ok: arm64 binary, parseable Info.plist, unsigned"

      # The runtime has to be in the artifact, not merely in the manifest. A build that resolved without
      # mlx-swift-lm still produces a signed-shaped .ipa that installs and runs; it just has no engine that
      # can load a downloaded model, and the Servers screen says so. Failing here is cheaper than finding
      # that out on the phone.
      - name: Fail if the MLX runtime was not resolved
        run: |
          set -euo pipefail
          CHECKOUTS="DerivedData/SourcePackages/checkouts"
          test -d "$CHECKOUTS" || { echo "FAIL: no package checkouts — nothing resolved"; exit 1; }
          for name in mlx-swift mlx-swift-lm; do
            if ! ls "$CHECKOUTS" | grep -qx "$name"; then
              echo "FAIL: $name did not resolve, so the shipped binary cannot run an on-device model"
              ls "$CHECKOUTS" | head -12
              exit 1
            fi
          done
          printf 'ok: MLX runtime resolved; app binary bytes: %s\n' \
            "$(stat -f%z DerivedData/Build/Products/Release-iphoneos/Cairn.app/Cairn)"

      - name: Package the .ipa
        run: |
          set -euo pipefail
          STAGE="Package/Payload"
          mkdir -p "$STAGE"
          cp -R "DerivedData/Build/Products/Release-iphoneos/Cairn.app" "$STAGE/"
          (cd Package && zip -qryX ../Cairn-unsigned.ipa Payload)
          echo "ipa contents (top level):"
          unzip -l Cairn-unsigned.ipa | sed -n '1,8p'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: cairn-unsigned-ipa
          path: Cairn-unsigned.ipa
          if-no-files-found: error
          retention-days: 14